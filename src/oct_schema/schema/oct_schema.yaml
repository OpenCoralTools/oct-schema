id: https://opencoral.tools/oct-schema
name: oct-schema
title: Open Coral Tools Schema
description: Data standards for coral research and conservation.

prefixes:
  linkml: https://w3id.org/linkml/
  oct: https://opencoral.tools/oct-schema/

imports:
  - linkml:types

default_range: string

classes:
  Coral:
    description: A coral entity.
    attributes:
      name:
        description: The name of the coral.
        range: string
